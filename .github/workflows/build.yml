name: Build and test
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test -c Release
      - run: ./dev/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-events
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS
